                        </div>
                        <div class="relative group">
                            <i data-lucide="film" class="w-3.5 h-3.5 absolute right-2.5 top-3 text-zinc-300 transition-colors group-hover:text-orange-500"></i>
                            <input type="text" id="inputFilmName" class="input-elegant text-[11px] font-sans font-medium text-orange-600 pr-8" placeholder="胶片卷标 (如: FUJIFILM RVP50)">
                        </div>
                    </div>

                    <button id="btnApplyTextToAll" class="mt-5 w-full py-2.5 bg-zinc-900 hover:bg-black text-white text-[11px] font-medium rounded-lg transition-all shadow-sm hover:shadow-md flex items-center justify-center gap-2">
                        <i data-lucide="copy-check" class="w-3.5 h-3.5"></i>
                        应用上述信息至所有图片
                    </button>
                </div>

            </div>
        </aside>
    </main>

    <!-- Hidden Elements & Modals -->
    <input type="file" id="fileInput" class="hidden" accept="image/jpeg, image/png, image/webp" multiple>
    <div id="toastContainer" class="fixed top-16 right-1/2 translate-x-1/2 md:translate-x-0 md:top-auto md:bottom-6 md:right-6 z-50 flex flex-col items-center md:items-end gap-2 pointer-events-none w-full md:w-auto px-4"></div>

    <div id="progressModal" class="fixed inset-0 bg-white/95 backdrop-blur-sm z-50 flex flex-col items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="w-80 max-w-[85%]">
            <h3 class="text-base md:text-lg font-serif mb-2 text-center" id="progressTitle">正在生成批量画册...</h3>
            <p class="text-[11px] md:text-xs text-zinc-500 mb-6 text-center" id="progressDesc">请勿关闭浏览器或切换标签页</p>
            <div class="w-full h-1.5 bg-zinc-200 rounded-full overflow-hidden">
                <div id="progressBar" class="h-full bg-black transition-all duration-300 w-0 rounded-full"></div>
            </div>
            <p class="text-[10px] text-zinc-400 mt-3 text-center tracking-widest font-mono" id="progressCount">0 / 0</p>
        </div>
    </div>

    <script>
        lucide.createIcons();

        class AppController {
            constructor() {
                this.state = {
                    images: [], 
                    activeId: null,
                    settings: {
                        style: 'exif', 
                        wallColor: '#f8f8f8',
                        frameColor: '#1c1c1c',
                        frameGradient: null,
                        matMultiplier: 1.0,
                        shadowMultiplier: 1.0,
                        invertAmount: 0,
                        grainAmount: 0.15,
                        bwAmount: 0
                    },
                    isProcessing: false,
                    grainPattern: null
                };
                this.OUTPUT_MAX_DIMENSION = 4500; 
                this.isRendering = false; 
                this.animationFrames = {}; 
                
                this.hitboxes = [];
                this.dragInfo = { active: false, id: null, offsetX: 0, offsetY: 0, currX: 0, currY: 0 };

                this.initDOM();
                this.bindEvents();
                this.initSortable();
                this.updateControlsVisibility(this.state.settings.style); 
                window.addEventListener('resize', this.debounce(() => this.renderPreview(false), 200));
            }

            initDOM() {
                this.dom = {
                    fileInput: document.getElementById('fileInput'),
                    btnAddFiles: document.getElementById('btnAddFiles'),
                    btnDownloadAll: document.getElementById('btnDownloadAll'),
                    btnDownloadCurrent: document.getElementById('btnDownloadCurrent'),
                    btnApplyTextToAll: document.getElementById('btnApplyTextToAll'),
                    
                    thumbnailList: document.getElementById('thumbnailList'),
                    previewSection: document.getElementById('previewSection'),
                    emptyState: document.getElementById('emptyState'),
                    canvasContainer: document.getElementById('canvasContainer'),
                    previewCanvas: document.getElementById('previewCanvas'),
                    controlPanel: document.getElementById('controlPanel'),
                    imgDimensions: document.getElementById('imgDimensions'),
                    globalLoader: document.getElementById('globalLoader'),
                    
                    inputLeft: document.getElementById('inputLeft'),
                    inputRight: document.getElementById('inputRight'),
                    inputExifTime: document.getElementById('inputExifTime'),
                    inputExifCamera: document.getElementById('inputExifCamera'),
                    inputExifLens: document.getElementById('inputExifLens'),
                    inputExifParams: document.getElementById('inputExifParams'),
                    inputFilmName: document.getElementById('inputFilmName'),
                    
                    matSizeSlider: document.getElementById('matSizeSlider'),
                    matSizeVal: document.getElementById('matSizeVal'),
                    shadowSlider: document.getElementById('shadowSlider'),
                    shadowVal: document.getElementById('shadowVal'),
                    
                    btnToggleBW: document.getElementById('btnToggleBW'),
                    btnToggleInvert: document.getElementById('btnToggleInvert'),

                    grainSlider: document.getElementById('grainSlider'), 
                    grainVal: document.getElementById('grainVal'),       
                    
                    tabBtns: document.querySelectorAll('.tab-btn'),
                    tabPanes: document.querySelectorAll('.tab-pane'),
                    styleBtns: document.querySelectorAll('.style-btn'),
                    wallBtns: document.querySelectorAll('.wall-btn'),
                    frameBtns: document.querySelectorAll('.frame-btn'),
                    
                    toastContainer: document.getElementById('toastContainer'),
                    progressModal: document.getElementById('progressModal'),
                    progressBar: document.getElementById('progressBar'),
                    progressTitle: document.getElementById('progressTitle'),
                    progressCount: document.getElementById('progressCount')
                };
                this.ctx = this.dom.previewCanvas.getContext('2d', { alpha: false });
            }

            initSortable() {
                new Sortable(this.dom.thumbnailList, {
                    animation: 150,
                    ghostClass: 'sortable-ghost',
                    onEnd: (evt) => {
                        const itemEls = this.dom.thumbnailList.querySelectorAll('.thumb-item');
                        const newOrderIds = Array.from(itemEls).map(el => el.dataset.id);
                        
                        this.state.images.sort((a, b) => {
                            return newOrderIds.indexOf(a.id) - newOrderIds.indexOf(b.id);
                        });

                        if (this.state.settings.style === 'film_strip') {
                            this.renderPreview(false); 
                        }
                    }
                });
            }

            animateFilter(key, targetValue) {
                if (this.animationFrames[key]) cancelAnimationFrame(this.animationFrames[key]);
                
                const startValue = this.state.settings[key];
                const startTime = performance.now();
                const duration = 250; 

                const animate = (now) => {
                    const elapsed = now - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const ease = progress === 1 ? 1 : 1 - Math.pow(2, -10 * progress);
                    
                    this.state.settings[key] = startValue + (targetValue - startValue) * ease;
                    this.renderPreview(false); 

                    if (progress < 1) {
                        this.animationFrames[key] = requestAnimationFrame(animate);
                    }
                };
                this.animationFrames[key] = requestAnimationFrame(animate);
            }

            bindEvents() {
                this.dom.btnAddFiles.addEventListener('click', () => this.dom.fileInput.click());
                this.dom.fileInput.addEventListener('change', (e) => this.handleFiles(e.target.files));
                
                const body = document.body;
                
                body.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    if (e.dataTransfer.types.includes('Files')) {
                        body.classList.add('drag-active');
                    }
                });
                body.addEventListener('dragleave', (e) => {
                    if (e.clientX === 0 || e.clientY === 0) body.classList.remove('drag-active');
                });
                body.addEventListener('drop', (e) => {
                    e.preventDefault();
                    body.classList.remove('drag-active');
                    if (!this.state.isProcessing && e.dataTransfer.files.length > 0) {
                        this.handleFiles(e.dataTransfer.files);
                    }
                });

                // Tab Navigation
                this.dom.tabBtns.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const targetTab = e.currentTarget.dataset.tab;
                        
                        this.dom.tabBtns.forEach(b => {
                            b.classList.remove('border-black', 'text-black');
                            b.classList.add('border-transparent', 'text-zinc-400');
                        });
                        e.currentTarget.classList.add('border-black', 'text-black');
                        e.currentTarget.classList.remove('border-transparent', 'text-zinc-400');
                        
                        this.dom.tabPanes.forEach(pane => {
                            pane.style.display = pane.id === targetTab ? 'block' : 'none';
                        });
                    });
                });

                // Style Buttons
                this.dom.styleBtns.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const target = e.currentTarget;
                        const newStyle = target.dataset.style;
                        this.updateSettings({ style: newStyle }, true);
                        this.dom.styleBtns.forEach(b => b.classList.remove('active'));
                        target.classList.add('active');
                    });
                });

                // Materials
                this.dom.wallBtns.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const color = e.target.dataset.wall;
                        this.updateSettings({ wallColor: color }, false); 
                        this.dom.wallBtns.forEach(b => b.classList.remove('ring-2', 'ring-offset-2', 'ring-black'));
                        e.target.classList.add('ring-2', 'ring-offset-2', 'ring-black');
                        this.dom.previewSection.style.backgroundColor = color;
                    });
                });

                this.dom.frameBtns.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const target = e.currentTarget;
                        this.updateSettings({ 
                            frameColor: target.dataset.frame,
                            frameGradient: target.style.background.includes('linear-gradient') ? target.style.background : null
                        }, false);
                        this.dom.frameBtns.forEach(b => b.classList.remove('ring-2', 'ring-offset-2', 'ring-black'));
                        target.classList.add('ring-2', 'ring-offset-2', 'ring-black');
                    });
                });

                // Toggles
                this.dom.btnToggleBW.addEventListener('click', () => {
                    const isBW = this.state.settings.bwAmount === 1;
                    this.animateFilter('bwAmount', isBW ? 0 : 1);
                    this.dom.btnToggleBW.classList.toggle('active-bw', !isBW);
                });

                this.dom.btnToggleInvert.addEventListener('click', () => {
                    const isInvert = this.state.settings.invertAmount === 1;
                    this.animateFilter('invertAmount', isInvert ? 0 : 1);
                    this.dom.btnToggleInvert.classList.toggle('active-invert', !isInvert);
                });

                // Sliders
                const sliderInputHandler = (key, value, displayElem) => {
                    if (!this.isRendering) {
                        this.isRendering = true;
                        requestAnimationFrame(() => {
                            this.updateSettings({ [key]: parseFloat(value) }, false); 
                            displayElem.textContent = `${Math.round(value * 100)}%`;
                            this.isRendering = false;
                        });
                    }
                };

                this.dom.matSizeSlider.addEventListener('input', (e) => sliderInputHandler('matMultiplier', e.target.value, this.dom.matSizeVal));
                this.dom.shadowSlider.addEventListener('input', (e) => sliderInputHandler('shadowMultiplier', e.target.value, this.dom.shadowVal));
                this.dom.grainSlider.addEventListener('input', (e) => sliderInputHandler('grainAmount', e.target.value, this.dom.grainVal)); 
                
                // Text Inputs
                const textInputHandler = this.debounce((key, value) => {
                    const activeImg = this.getActiveImage();
                    if(activeImg) {
                        activeImg[key] = value;
                        this.renderPreview(false); 
                    }
                }, 100);

                this.dom.inputLeft.addEventListener('input', (e) => textInputHandler('textLeft', e.target.value));
                this.dom.inputRight.addEventListener('input', (e) => textInputHandler('textRight', e.target.value));
                this.dom.inputExifTime.addEventListener('input', (e) => textInputHandler('exifTime', e.target.value));
                this.dom.inputExifCamera.addEventListener('input', (e) => textInputHandler('exifCamera', e.target.value));
                this.dom.inputExifLens.addEventListener('input', (e) => textInputHandler('exifLens', e.target.value));
                this.dom.inputExifParams.addEventListener('input', (e) => textInputHandler('exifParams', e.target.value));
                this.dom.inputFilmName.addEventListener('input', (e) => textInputHandler('filmName', e.target.value));

                this.dom.btnApplyTextToAll.addEventListener('click', () => {
                    const activeImg = this.getActiveImage();
                    if (!activeImg) return;
                    this.state.images.forEach(img => {
                        img.textLeft = activeImg.textLeft;
                        img.textRight = activeImg.textRight;
                        img.exifTime = activeImg.exifTime;
                        img.exifCamera = activeImg.exifCamera;
                        img.exifLens = activeImg.exifLens;
                        img.exifParams = activeImg.exifParams;
                        img.filmName = activeImg.filmName;
                    });
                    this.showToast('元数据已同步至所有图片', 'success');
                });

                this.dom.btnDownloadCurrent.addEventListener('click', () => this.downloadCurrent());
                this.dom.btnDownloadAll.addEventListener('click', () => this.downloadAll());

                // --- CANVAS DRAG & DROP (for film strip) ---
                const cvs = this.dom.previewCanvas;
                
                const getCoords = (e) => {
                    const rect = cvs.getBoundingClientRect();
                    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                    const canvasRatio = cvs.width / cvs.height;
                    const rectRatio = rect.width / rect.height;

                    let renderW, renderH, offsetX = 0, offsetY = 0;
                    if (canvasRatio > rectRatio) {
                        renderW = rect.width;
                        renderH = rect.width / canvasRatio;
                        offsetY = (rect.height - renderH) / 2;
                    } else {
                        renderH = rect.height;
                        renderW = rect.height * canvasRatio;
                        offsetX = (rect.width - renderW) / 2;
                    }

                    const scale = cvs.width / renderW;
                    return {
                        x: (clientX - rect.left - offsetX) * scale,
                        y: (clientY - rect.top - offsetY) * scale
                    };
                };

                const handleDown = (e) => {
                    if (this.state.settings.style !== 'film_strip') return;
                    const coords = getCoords(e);
                    
                    for (let i = this.hitboxes.length - 1; i >= 0; i--) {
                        const box = this.hitboxes[i];
                        if (coords.x >= box.x && coords.x <= box.x + box.w &&
                            coords.y >= box.y && coords.y <= box.y + box.h) {
                            
                            this.dragInfo = {
                                active: true,
                                id: box.id,
                                offsetX: coords.x - box.x,
                                offsetY: coords.y - box.y,
                                currX: coords.x,
                                currY: coords.y
                            };
                            cvs.style.cursor = 'grabbing';
                            this.renderPreview(false); 
                            break;
                        }
                    }
                };

                const handleMove = (e) => {
                    if (!this.dragInfo.active) return;
                    e.preventDefault(); 
                    const coords = getCoords(e);
                    this.dragInfo.currX = coords.x;
                    this.dragInfo.currY = coords.y;

                    let swapId = null;
                    for (let box of this.hitboxes) {
                        if (box.id !== this.dragInfo.id) {
                            if (coords.x >= box.x && coords.x <= box.x + box.w &&
                                coords.y >= box.y && coords.y <= box.y + box.h) {
                                swapId = box.id;
                                break;
                            }
                        }
                    }

                    if (swapId) {
                        const idx1 = this.state.images.findIndex(img => img.id === this.dragInfo.id);
                        const idx2 = this.state.images.findIndex(img => img.id === swapId);
                        if (idx1 > -1 && idx2 > -1) {
                            const temp = this.state.images[idx1];
                            this.state.images[idx1] = this.state.images[idx2];
                            this.state.images[idx2] = temp;
                            this.updateThumbnailsOrderDOM(); 
                        }
                    }
                    this.renderPreview(false);
                };

                const handleUp = () => {
                    if (this.dragInfo.active) {
                        this.dragInfo.active = false;
                        cvs.style.cursor = 'auto';
                        this.renderPreview(false);
                    }
                };

                cvs.addEventListener('mousedown', handleDown);
                cvs.addEventListener('mousemove', handleMove);
                window.addEventListener('mouseup', handleUp); 
                cvs.addEventListener('touchstart', handleDown, {passive: false});
                cvs.addEventListener('touchmove', handleMove, {passive: false});
                window.addEventListener('touchend', handleUp);
            }

            debounce(func, wait) {
                let timeout;
                return function (...args) {
                    clearTimeout(timeout);
                    timeout = setTimeout(() => func.apply(this, args), wait);
                };
            }

            updateThumbnailsOrderDOM() {
                this.state.images.forEach(img => {
                    const thumb = this.dom.thumbnailList.querySelector(`[data-id="${img.id}"]`);
                    if (thumb) this.dom.thumbnailList.appendChild(thumb);
                });
            }

            extractPalette(imgObj) {
                try {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d', { willReadFrequently: true });
                    // 1. 扩大采样范围以获得更准确的占比统计
                    canvas.width = 64; canvas.height = 64;
                    ctx.drawImage(imgObj, 0, 0, 64, 64);
                    const data = ctx.getImageData(0, 0, 64, 64).data;
                    
                    const colorCounts = {};
                    let maxCount = 0;
                    let dominantBin = null;
                    const colorPool = [];
                    const binSize = 32; // 色彩量化步长：将相近的颜色归为一个“桶”进行频次统计

                    for(let i=0; i<data.length; i+=4) {
                        if (data[i+3] > 128) {
                            const r = data[i], g = data[i+1], b = data[i+2];
                            colorPool.push({r, g, b});

                            // 2. 将相近颜色分箱统计
                            const binKey = `${Math.floor(r/binSize)},${Math.floor(g/binSize)},${Math.floor(b/binSize)}`;
                            if (!colorCounts[binKey]) {
                                colorCounts[binKey] = { count: 0, rSum: 0, gSum: 0, bSum: 0 };
                            }
                            colorCounts[binKey].count++;
                            colorCounts[binKey].rSum += r;
                            colorCounts[binKey].gSum += g;
                            colorCounts[binKey].bSum += b;

                            // 记录拥有最多像素点的色彩桶
                            if (colorCounts[binKey].count > maxCount) {
                                maxCount = colorCounts[binKey].count;
                                dominantBin = colorCounts[binKey];
                            }
                        }
                    }

                    const defaultPalette = [
                        { rgbStr: '#d4d4d8', hex: '#d4d4d8', r: 212, g: 212, b: 216 },
                        { rgbStr: '#a1a1aa', hex: '#a1a1aa', r: 161, g: 161, b: 170 },
                        { rgbStr: '#71717a', hex: '#71717a', r: 113, g: 113, b: 122 },
                        { rgbStr: '#3f3f46', hex: '#3f3f46', r: 63, g: 63, b: 70 }
                    ];

                    if (colorPool.length === 0 || !dominantBin) return defaultPalette;

                    // 3. 计算占比最大桶的真实平均颜色 (Dominant Color)
                    const domR = Math.round(dominantBin.rSum / dominantBin.count);
                    const domG = Math.round(dominantBin.gSum / dominantBin.count);
                    const domB = Math.round(dominantBin.bSum / dominantBin.count);
                    const dominantColor = { r: domR, g: domG, b: domB };

                    // 4. 将主颜色放在第一位，其余寻找对比色填充，保持其余模板的多样性
                    let picked = [dominantColor];
                    const dist = (c1, c2) => Math.pow(c1.r-c2.r,2) + Math.pow(c1.g-c2.g,2) + Math.pow(c1.b-c2.b,2);

                    while(picked.length < 4) {
                        let maxDist = -1;
                        let furthestColor = colorPool[0];
                        for(let c of colorPool) {
                            let minDistToPicked = Math.min(...picked.map(p => dist(c, p)));
                            if(minDistToPicked > maxDist) {
                                maxDist = minDistToPicked;
                                furthestColor = c;
                            }
                        }
                        picked.push(furthestColor);
                    }

                    // 取消基于亮度的重排序，严格保持 picked[0] 是我们统计出的面积最大主颜色
                    
                    const rgbToHex = (r, g, b) => '#' + [r, g, b].map(x => {
                        const hex = x.toString(16);
                        return hex.length === 1 ? '0' + hex : hex;
                    }).join('');

                    return picked.map(c => ({
                        rgbStr: `rgba(${c.r}, ${c.g}, ${c.b}, 0.85)`,
                        hex: rgbToHex(c.r, c.g, c.b),
                        r: c.r,
                        g: c.g,
                        b: c.b
                    }));
                } catch(e) {
                    return [
                        { rgbStr: '#d4d4d8', hex: '#d4d4d8', r: 212, g: 212, b: 216 },
                        { rgbStr: '#a1a1aa', hex: '#a1a1aa', r: 161, g: 161, b: 170 },
                        { rgbStr: '#71717a', hex: '#71717a', r: 113, g: 113, b: 122 },
                        { rgbStr: '#3f3f46', hex: '#3f3f46', r: 63, g: 63, b: 70 }
                    ];
                }
            }

            async handleFiles(fileList) {
                const files = Array.from(fileList).filter(f => f.type.startsWith('image/'));
                if (files.length === 0) { this.showToast('未检测到有效的图片文件', 'error'); return; }

                this.dom.globalLoader.classList.add('active'); 
                await new Promise(r => setTimeout(r, 100));

                if (this.state.images.length === 0) {
                    this.dom.emptyState.classList.add('opacity-0');
                    setTimeout(() => this.dom.emptyState.style.display = 'none', 500);
                    this.dom.controlPanel.classList.remove('opacity-40', 'pointer-events-none');
                    this.dom.btnDownloadCurrent.removeAttribute('disabled');
                    this.dom.btnDownloadAll.removeAttribute('disabled');
                    this.dom.btnDownloadCurrent.classList.remove('hidden');
                    this.dom.btnDownloadAll.classList.remove('hidden');
                    this.dom.btnDownloadCurrent.classList.add('flex');
                    this.dom.btnDownloadAll.classList.add('flex');
                }

                let firstNewId = null;

                for (let file of files) {
                    try {
                        const url = URL.createObjectURL(file);
                        const imgObj = await this.loadImage(url);
                        
                        let exifData = null;
                        try {
                            if (typeof exifr !== 'undefined') {
                                exifData = await exifr.parse(file);
                            }
                        } catch (err) { console.warn("EXIF 解析跳过:", err); }

                        let camera = 'DIGITAL CAMERA';
                        if (exifData?.Make || exifData?.Model) {
                            let make = exifData.Make || '';
                            let model = exifData.Model || '';
                            if (model.toUpperCase().startsWith(make.toUpperCase())) {
                                camera = model.toUpperCase();
                            } else {
                                camera = `${make} ${model}`.trim().toUpperCase();
                            }
                        }

                        let lens = exifData?.LensModel ? exifData.LensModel.toUpperCase() : 'STANDARD LENS';
                        let focal = exifData?.FocalLength ? `${parseFloat(Number(exifData.FocalLength).toFixed(1))}MM` : '';
                        let fnumber = exifData?.FNumber ? `F${parseFloat(Number(exifData.FNumber).toFixed(1))}` : '';
                        let exposure = '';
                        if (exifData?.ExposureTime) {
                            exposure = exifData.ExposureTime >= 1 ? `${exifData.ExposureTime}S` : `1/${Math.round(1/exifData.ExposureTime)}S`;
                        }
                        let iso = exifData?.ISO ? `ISO${exifData.ISO}` : '';
                        
                        let params = [focal, fnumber, exposure, iso].filter(Boolean).join(' ');
                        if (!params) params = '50MM F2.8 1/100S ISO250';

                        let dateStr = 'PHOTOGRAPHED IN : JUN 20, 2026';
                        let timeStr = '8:40 PM';
                        if (exifData?.DateTimeOriginal) {
                            try {
                                const d = new Date(exifData.DateTimeOriginal);
                                const options = { month: 'short', day: 'numeric', year: 'numeric' };
                                dateStr = 'PHOTOGRAPHED IN : ' + d.toLocaleDateString('en-US', options).toUpperCase();
                                timeStr = d.toLocaleTimeString('en-US', {hour: 'numeric', minute: '2-digit'}).toUpperCase();
                            } catch(e) {}
                        }

                        const defaultTitle = file.name.split('.')[0].replace(/[-_]/g, ' ').toUpperCase() || 'UNTITLED ARTWORK';
                        const palette = this.extractPalette(imgObj);

                        const newImg = {
                            id: 'img_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
                            file: file, url: url, imgObj: imgObj,
                            width: imgObj.width, height: imgObj.height,
                            textLeft: defaultTitle,
                            textRight: '© XIANG EDITION',
                            exifTime: timeStr,
                            exifCamera: camera,
                            exifLens: lens,
                            exifParams: params,
                            exifDate: dateStr,
                            filmName: 'FUJIFILM RVP50',
                            palette: palette 
                        };
                        
                        this.state.images.push(newImg);
                        this.addThumbnail(newImg);
                        if (!firstNewId) firstNewId = newImg.id;
                    } catch (e) { console.error("加载失败:", file.name, e); }
                }
                
                this.dom.globalLoader.classList.remove('active'); 
                
                if (firstNewId) this.setActiveImage(firstNewId); 
                this.showToast(`成功加载并解析 ${files.length} 张图片`, 'success');
            }

            loadImage(url) {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    img.onload = () => resolve(img);
                    img.onerror = reject;
                    img.src = url;
                });
            }

            addThumbnail(imgData) {
                const div = document.createElement('div');
                div.className = 'thumb-item relative shrink-0 w-12 h-12 md:w-full md:h-auto aspect-square rounded overflow-hidden bg-zinc-200 border-2 border-transparent hover:border-zinc-400 cursor-grab active:cursor-grabbing';
                div.dataset.id = imgData.id;
                div.innerHTML = `<img src="${imgData.url}" class="w-full h-full object-cover pointer-events-none">`;
                
                const delBtn = document.createElement('button');
                delBtn.className = 'absolute top-0.5 right-0.5 md:top-1 md:right-1 w-4 h-4 md:w-5 md:h-5 bg-black/60 hover:bg-red-600 text-white rounded-full flex items-center justify-center opacity-0 transition-opacity z-10';
                delBtn.innerHTML = '<i data-lucide="x" class="w-2.5 h-2.5"></i>';
                
                div.addEventListener('mouseenter', () => delBtn.style.opacity = '1');
                div.addEventListener('mouseleave', () => delBtn.style.opacity = '0');
                delBtn.addEventListener('click', (e) => { e.stopPropagation(); this.removeImage(imgData.id); });
                
                div.appendChild(delBtn);
                div.addEventListener('click', () => this.setActiveImage(imgData.id));
                this.dom.thumbnailList.appendChild(div);
                lucide.createIcons({ root: div });
            }

            removeImage(id) {
                const index = this.state.images.findIndex(img => img.id === id);
                if (index > -1) {
                    URL.revokeObjectURL(this.state.images[index].url);
                    this.state.images.splice(index, 1);
                    const thumb = document.querySelector(`.thumb-item[data-id="${id}"]`);
                    if(thumb) thumb.remove();

                    if (this.state.images.length === 0) {
                        this.resetUI();
                    } else if (this.state.activeId === id) {
                        const nextIndex = Math.min(index, this.state.images.length - 1);
                        this.setActiveImage(this.state.images[nextIndex].id);
                    }
                    if (this.state.settings.style === 'film_strip') {
                        this.renderPreview(true);
                    }
                }
            }
            
            resetUI() {
                this.state.activeId = null;
                this.dom.emptyState.style.display = 'flex';
                this.dom.emptyState.classList.remove('opacity-0');
                this.dom.controlPanel.classList.add('opacity-40', 'pointer-events-none');
                this.dom.btnDownloadCurrent.setAttribute('disabled', 'true');
                this.dom.btnDownloadAll.setAttribute('disabled', 'true');
                this.dom.previewCanvas.classList.remove('loaded');
                this.ctx.clearRect(0, 0, this.dom.previewCanvas.width, this.dom.previewCanvas.height);
                this.dom.imgDimensions.textContent = '-- x --';
            }

            getActiveImage() { return this.state.images.find(img => img.id === this.state.activeId); }

            setActiveImage(id) {
                this.state.activeId = id;
                const imgData = this.getActiveImage();
                if (!imgData) return;

                document.querySelectorAll('.thumb-item').forEach(el => {
                    el.classList.remove('active');
                    if (el.dataset.id === id) el.classList.add('active');
                });

                this.dom.inputLeft.value = imgData.textLeft;
                this.dom.inputRight.value = imgData.textRight;
                this.dom.inputExifTime.value = imgData.exifTime || '';
                this.dom.inputExifCamera.value = imgData.exifCamera;
                this.dom.inputExifLens.value = imgData.exifLens;
                this.dom.inputExifParams.value = imgData.exifParams;
                this.dom.inputFilmName.value = imgData.filmName;
                this.dom.imgDimensions.textContent = `${imgData.width} × ${imgData.height}`;

                this.renderPreview(true); 
            }

            updateSettings(newSettings, animate = false) {
                const oldStyle = this.state.settings.style;
                this.state.settings = { ...this.state.settings, ...newSettings };
                
                if (newSettings.style && newSettings.style !== oldStyle) {
                    this.updateControlsVisibility(newSettings.style);
                }
                
                this.renderPreview(animate);
            }

            updateControlsVisibility(style) {
                const isFilm = style.startsWith('film');
                const isGallery = ['framed', 'museum', 'floating', 'polaroid'].includes(style);
                const isArtist = ['exif', 'exif_palette', 'exif_minimal', 'grid_mosaic', 'immersive_color'].includes(style);

                const secLayout = document.getElementById('section-layout');
                const ctrlMargin = document.getElementById('ctrl-margin');
                const ctrlShadow = document.getElementById('ctrl-shadow');
                
                const secFilm = document.getElementById('section-film');
                
                const secMaterials = document.getElementById('section-materials');
                const ctrlWall = document.getElementById('ctrl-wall');
                const ctrlFrame = document.getElementById('ctrl-frame');

                if (secFilm) secFilm.style.display = isFilm ? 'block' : 'none';

                if (style === 'film4x5' || style === 'film_xpan') {
                    if (secLayout) secLayout.style.display = 'none';
                } else if (isArtist) {
                    if (secLayout) secLayout.style.display = 'block';
                    if (ctrlMargin) ctrlMargin.style.display = 'block';
                    if (ctrlShadow) ctrlShadow.style.display = 'none';
                } else {
                    if (secLayout) secLayout.style.display = 'block';
                    if (ctrlMargin) ctrlMargin.style.display = 'block';
                    if (ctrlShadow) ctrlShadow.style.display = 'block';
                }

                if (isGallery) {
                    if (secMaterials) secMaterials.style.display = 'block';
                    if (ctrlWall) ctrlWall.style.display = 'block';
                    if (ctrlFrame) ctrlFrame.style.display = 'block';
                } else if (style === 'film35mm' || style === 'film_strip' || style === 'unframed') {
                    if (secMaterials) secMaterials.style.display = 'block';
                    if (ctrlWall) ctrlWall.style.display = 'block';
                    if (ctrlFrame) ctrlFrame.style.display = 'none';
                } else {
                    if (secMaterials) secMaterials.style.display = 'none';
                }
            }

            createFilmGrainPattern(ctx, scale) {
                if (this.state.grainPattern) return this.state.grainPattern;
                
                const patternCanvas = document.createElement('canvas');
                const size = 128;
                patternCanvas.width = size;
                patternCanvas.height = size;
                const pCtx = patternCanvas.getContext('2d');
                const imgData = pCtx.createImageData(size, size);
                
                for (let i = 0; i < imgData.data.length; i += 4) {
                    const val = Math.random() * 255;
                    imgData.data[i] = val;
                    imgData.data[i+1] = val;
                    imgData.data[i+2] = val;
                    imgData.data[i+3] = 40; 
                }
                pCtx.putImageData(imgData, 0, 0);
                this.state.grainPattern = ctx.createPattern(patternCanvas, 'repeat');
                return this.state.grainPattern;
            }

            drawDXCode(ctx, x, y, width, height, seed) {
                ctx.fillStyle = 'rgba(250, 204, 21, 0.7)';
                for(let b=0; b<5; b++) {
                    const hash = Math.sin(seed + b * 1.3) * 10000;
                    if(hash - Math.floor(hash) > 0.4) {
                        ctx.fillRect(x + b*width*0.25, y, width*0.18, height);
                    }
                }
            }

            getFilteredImage(imgDataObj, w, h, bwAmount, invertAmount) {
                if (bwAmount === 0 && invertAmount === 0) return imgDataObj.imgObj;

                const rw = Math.max(1, Math.round(w));
                const rh = Math.max(1, Math.round(h));
                
                const cacheKey = `${bwAmount.toFixed(3)}_${invertAmount.toFixed(3)}_${rw}_${rh}`;
                if (imgDataObj.filterCache && imgDataObj.filterCache.key === cacheKey) {
                    return imgDataObj.filterCache.canvas;
                }

                const canvas = document.createElement('canvas');
                canvas.width = rw;
                canvas.height = rh;
                const ctx = canvas.getContext('2d', { willReadFrequently: true });
                
                ctx.drawImage(imgDataObj.imgObj, 0, 0, rw, rh);

                const imgPixels = ctx.getImageData(0, 0, rw, rh);
                const data = imgPixels.data;

                for (let i = 0; i < data.length; i += 4) {
                    let r = data[i], g = data[i+1], b = data[i+2];

                    if (bwAmount > 0) {
                        const gray = 0.299 * r + 0.587 * g + 0.114 * b;
                        r = r + (gray - r) * bwAmount;
                        g = g + (gray - g) * bwAmount;
                        b = b + (gray - b) * bwAmount;
                    }

                    if (invertAmount > 0) {
                        r = r + (255 - r * 2) * invertAmount;
                        g = g + (255 - g * 2) * invertAmount;
                        b = b + (255 - b * 2) * invertAmount;
                    }

                    data[i] = r; data[i+1] = g; data[i+2] = b;
                }

                ctx.putImageData(imgPixels, 0, 0);

                if (imgDataObj.filterCache && imgDataObj.filterCache.canvas) {
                    imgDataObj.filterCache.canvas.width = 0;
                    imgDataObj.filterCache.canvas.height = 0;
                }

                imgDataObj.filterCache = { key: cacheKey, canvas: canvas };
                return canvas;
            }

            renderScene(ctx, imgData, targetWidth, targetHeight) {
                const { style, wallColor, frameColor, frameGradient, matMultiplier, shadowMultiplier, invertAmount, grainAmount, bwAmount } = this.state.settings;
                const { imgObj, width: imgW, height: imgH, textLeft, textRight, exifTime, exifCamera, exifLens, exifParams, filmName } = imgData;

                const shortEdge = Math.min(imgW, imgH);
                
                let wallPaddingX = imgW * 0.25;
                let wallPaddingY = imgH * 0.25;
                
                let sceneW, sceneH;
                let drawLogic = () => {}; 
                this.hitboxes = []; 
                let dragDrawOperation = null; 

                const drawBackground = (sc) => {
                    ctx.fillStyle = wallColor;
                    ctx.fillRect(0, 0, sceneW * sc, sceneH * sc);
                };

                const applyFrameMaterial = (fX, fY, fW, fH) => {
                    if (frameGradient) {
                        const grad = ctx.createLinearGradient(fX, fY, fX+fW, fY+fH);
                        const colors = frameGradient.match(/#[a-f0-9]{6}/gi) || ['#000', '#333'];
                        grad.addColorStop(0, colors[0]);
                        grad.addColorStop(1, colors[1] || colors[0]);
                        ctx.fillStyle = grad;
                    } else { ctx.fillStyle = frameColor; }
                }

                if (style === 'unframed') {
                    // (Logic preserved from original unframed)
                    const pad = imgW * 0.1 * matMultiplier;
                    sceneW = imgW + pad * 2 + wallPaddingX * 2;
                    sceneH = imgH + pad * 2 + wallPaddingY * 2;
                    drawLogic = (scale) => {
                        drawBackground(scale);
                        const pX = wallPaddingX * scale, pY = wallPaddingY * scale, pW = (imgW + pad * 2) * scale, pH = (imgH + pad * 2) * scale;
                        ctx.save(); ctx.shadowColor = `rgba(0, 0, 0, ${0.1 * shadowMultiplier})`; ctx.shadowBlur = shortEdge * 0.05 * scale * shadowMultiplier; ctx.shadowOffsetY = shortEdge * 0.02 * scale * shadowMultiplier;
                        ctx.fillStyle = '#ffffff'; ctx.fillRect(pX, pY, pW, pH); ctx.restore();
                        
                        const fImg = this.getFilteredImage(imgData, imgW * scale, imgH * scale, bwAmount, invertAmount);
                        ctx.drawImage(fImg, pX + pad * scale, pY + pad * scale, imgW * scale, imgH * scale);
                    };

                } else if (style === 'immersive_color') {
                    wallPaddingX = 0; wallPaddingY = 0;
                    
                    // 设计师微调：色块占据 75% 比例，整体画幅更匀称
                    const topBlockH = imgH * 0.75; 
                    
                    sceneW = imgW;
                    sceneH = topBlockH + imgH;

                    drawLogic = (scale) => {
                        const sW = sceneW * scale;
                        const sH = sceneH * scale;
                        const sTopH = topBlockH * scale;
                        
                        // 1. 提取颜色
                        let mainColorHex = '#2c3e50'; 
                        let mainColorRgb = {r: 44, g: 62, b: 80};
                        
                        if (imgData.palette && imgData.palette.length > 0) {
                            mainColorHex = imgData.palette[0].hex;
                            mainColorRgb = { r: imgData.palette[0].r, g: imgData.palette[0].g, b: imgData.palette[0].b };
                        }

                        // 2. 亮度计算与色彩对比
                        const luminance = (0.299*mainColorRgb.r + 0.587*mainColorRgb.g + 0.114*mainColorRgb.b)/255;
                        const isLightBg = luminance > 0.6;
                        
                        const mainTextColor = isLightBg ? 'rgba(0, 0, 0, 0.9)' : 'rgba(255, 255, 255, 0.95)';
                        const subTextColor = isLightBg ? 'rgba(0, 0, 0, 0.5)' : 'rgba(255, 255, 255, 0.6)';
                        const accentTextColor = isLightBg ? 'rgba(0, 0, 0, 0.25)' : 'rgba(255, 255, 255, 0.3)';

                        // 3. 绘制背景与图像
                        ctx.fillStyle = mainColorHex;
                        ctx.fillRect(0, 0, sW, sTopH);
                        const fImg = this.getFilteredImage(imgData, imgW * scale, imgH * scale, bwAmount, invertAmount);
                        ctx.drawImage(fImg, 0, sTopH, imgW * scale, imgH * scale);

                        // 4. 设计师级精细排版 (Pantone Swatch Style)
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle'; // 使用 middle 基线，完美居中计算
                        
                        const textCenterX = sW / 2;
                        
                        // 字体大小定义
                        const hexFontSize = sW * 0.045;   // 强化 HEX，作为核心视觉锚点
                        const detailFontSize = sW * 0.012;
                        const titleFontSize = sW * 0.018; 
                        const timeFontSize = sW * 0.011;
                        const metaFontSize = sW * 0.009;

                        // 间距动态计算
                        const gapHexDetail = hexFontSize * 1.0;
                        const gapDetailTitle = sTopH * 0.12; // 颜色档案与照片信息之间的优雅留白
                        const gapTitleTime = titleFontSize * 1.6;

                        // 汇总文本块总高度
                        const totalBlockHeight = gapHexDetail + gapDetailTitle + gapTitleTime;
                        
                        // ✨ 视觉重心平衡魔法：将整个文本块定在 47% 的黄金视觉中心点 ✨
                        const startY = (sTopH * 0.47) - (totalBlockHeight / 2);
                        
                        const hexY = startY;
                        const detailY = hexY + gapHexDetail;
                        const titleY = detailY + gapDetailTitle;
                        const timeY = titleY + gapTitleTime;

                        // --- 核心：HEX 色值 ---
                        ctx.font = `700 ${hexFontSize}px "JetBrains Mono", monospace`;
                        ctx.fillStyle = mainTextColor;
                        try { ctx.letterSpacing = `${hexFontSize * 0.02}px`; } catch(e){}
                        ctx.fillText(mainColorHex.toUpperCase(), textCenterX, hexY);
                        try { ctx.letterSpacing = '0px'; } catch(e){}

                        // --- 细节：RGB & CMYK ---
                        const rNorm = mainColorRgb.r / 255; const gNorm = mainColorRgb.g / 255; const bNorm = mainColorRgb.b / 255;
                        const kValue = Math.min(1 - rNorm, 1 - gNorm, 1 - bNorm);
                        const cValue = kValue === 1 ? 0 : (1 - rNorm - kValue) / (1 - kValue);
                        const mValue = kValue === 1 ? 0 : (1 - gNorm - kValue) / (1 - kValue);
                        const yValue = kValue === 1 ? 0 : (1 - bNorm - kValue) / (1 - kValue);
                        
                        const cmykStr = `C${Math.round(cValue*100)} M${Math.round(mValue*100)} Y${Math.round(yValue*100)} K${Math.round(kValue*100)}`;
                        const rgbStr = `R${mainColorRgb.r} G${mainColorRgb.g} B${mainColorRgb.b}`;
                        
                        ctx.font = `500 ${detailFontSize}px "JetBrains Mono", monospace`;
                        ctx.fillStyle = subTextColor;
                        try { ctx.letterSpacing = `${detailFontSize * 0.15}px`; } catch(e){}
                        ctx.fillText(`${rgbStr}   |   ${cmykStr}`, textCenterX, detailY);
                        try { ctx.letterSpacing = '0px'; } catch(e){}

                        // --- 标题 ---
                        ctx.font = `500 ${titleFontSize}px "Inter", -apple-system, "PingFang SC", sans-serif`;
                        ctx.fillStyle = mainTextColor;
                        const titleText = (textLeft || 'UNTITLED ARTWORK').toUpperCase();
                        try { ctx.letterSpacing = `${titleFontSize * 0.25}px`; } catch(e){} // 极宽字距，增加呼吸感
                        ctx.fillText(titleText, textCenterX, titleY);
                        try { ctx.letterSpacing = '0px'; } catch(e){}

                        // --- 时间 ---
                        ctx.font = `400 ${timeFontSize}px "JetBrains Mono", "Inter", monospace`;
                        ctx.fillStyle = subTextColor;
                        try { ctx.letterSpacing = `${timeFontSize * 0.15}px`; } catch(e){}
                        ctx.fillText(exifTime || '8:40 PM', textCenterX, timeY);
                        try { ctx.letterSpacing = '0px'; } catch(e){}
                        
                        // --- 底部极简修饰水印 ---
                        if (matMultiplier > 0.4) {
                            ctx.font = `400 ${metaFontSize}px "JetBrains Mono", monospace`;
                            ctx.fillStyle = accentTextColor;
                            try { ctx.letterSpacing = `${metaFontSize * 0.25}px`; } catch(e){}
                            ctx.fillText(`COLOR ARCHIVE INDEX: ${imgData.id.split('_')[1] || '001'}`, textCenterX, sTopH - (metaFontSize * 3));
                            try { ctx.letterSpacing = '0px'; } catch(e){}
                        }
                    };

                } else if (style === 'framed' || style === 'museum') {
                    const isMuseum = style === 'museum';
                    const frameT = shortEdge * (isMuseum ? 0.015 : 0.035);
                    const matX = shortEdge * (isMuseum ? 0.25 : 0.12) * matMultiplier; 
                    const matTop = shortEdge * (isMuseum ? 0.25 : 0.12) * matMultiplier;
                    const matBot = shortEdge * (isMuseum ? 0.35 : 0.18) * matMultiplier; 
                    const frameW = imgW + (matX * 2) + (frameT * 2);
                    const frameH = imgH + (matTop + matBot) + (frameT * 2);
                    sceneW = frameW + wallPaddingX * 2; sceneH = frameH + wallPaddingY * 2;

                    drawLogic = (scale) => {
                        drawBackground(scale);
                        const fX = wallPaddingX * scale, fY = wallPaddingY * scale, fW = frameW * scale, fH = frameH * scale, fTs = frameT * scale;
                        ctx.save(); ctx.shadowColor = `rgba(0, 0, 0, ${0.18 * shadowMultiplier})`; ctx.shadowBlur = shortEdge * 0.08 * scale * shadowMultiplier; ctx.shadowOffsetY = shortEdge * 0.03 * scale * shadowMultiplier;
                        applyFrameMaterial(fX, fY, fW, fH); ctx.fillRect(fX, fY, fW, fH); ctx.restore();
                        ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(fX + fTs*0.8, fY + fTs*0.8, fW - fTs*1.6, fH - fTs*1.6);
                        const mX = fX + fTs, mY = fY + fTs, mW = fW - fTs * 2, mH = fH - fTs * 2;
                        ctx.fillStyle = '#fafafa'; ctx.fillRect(mX, mY, mW, mH);
                        ctx.save();
                        const iX = mX + (matX * scale), iY = mY + (matTop * scale), iW = imgW * scale, iH = imgH * scale;
                        
                        const fImg = this.getFilteredImage(imgData, iW, iH, bwAmount, invertAmount);
                        ctx.drawImage(fImg, iX, iY, iW, iH);

                        ctx.strokeStyle = `rgba(0,0,0,${0.15 * shadowMultiplier})`; ctx.lineWidth = shortEdge * 0.005 * scale; ctx.strokeRect(iX, iY, iW, iH);
                        ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = shortEdge * 0.002 * scale; ctx.strokeRect(iX - ctx.lineWidth, iY - ctx.lineWidth, iW + ctx.lineWidth*2, iH + ctx.lineWidth*2);
                        ctx.restore();
                        if(matMultiplier > 0.3) {
                            const fontSize = shortEdge * 0.016 * scale; ctx.font = `500 ${fontSize}px "Inter", "Noto Serif SC", sans-serif`; ctx.fillStyle = '#1a1a1a'; ctx.textBaseline = 'middle';
                            const textY = mY + mH - ((matBot * scale) * 0.45);
                            if (textLeft) { ctx.textAlign = 'left'; ctx.fillText(textLeft.toUpperCase(), mX + (matX * scale), textY); }
                            if (textRight) { ctx.textAlign = 'right'; ctx.fillText(textRight, mX + mW - (matX * scale), textY); }
                        }
                    };

                } else if (style === 'floating') {
                    const frameT = shortEdge * 0.025, matPad = shortEdge * 0.15 * matMultiplier;

                } else if (style === 'grid_mosaic') {

                    }

                    const sCellH = sCropH / rows;

                    let seed = 0;
                    for (let i = 0; i < imgData.id.length; i++) seed += imgData.id.charCodeAt(i);

                    for (let i = shuffledSources.length - 1; i > 0; i--) {

                            }

                            ctx.strokeStyle = 'rgba(255,255,255,0.08)';
                            ctx.lineWidth = Math.max(1, baseH * 0.001 * scale);
                            ctx.beginPath();
                            ctx.moveTo(fX, topHoleY - baseH * 0.01 * scale); ctx.lineTo(fX + fW, topHoleY - baseH * 0.01 * scale);
                            ctx.moveTo(fX, botHoleY + holeH + baseH * 0.01 * scale); ctx.lineTo(fX + fW, botHoleY + holeH + baseH * 0.01 * scale);
                            ctx.stroke();

                            let currX = fX + filmPadX * scale;

                            rowInfo.layout.forEach(item => {
                                const iW = item.w * scale;
                                const iH = item.h * scale;
                                const iX = currX;
                                const iY = fY + filmPadY * scale;

                                this.hitboxes.push({ id: item.originalData.id, x: iX, y: iY, w: iW, h: iH });

                                if (this.dragInfo.active && this.dragInfo.id === item.originalData.id) {
                                    ctx.save();
                                    ctx.fillStyle = 'rgba(255,255,255,0.05)';
                                    ctx.fillRect(iX, iY, iW, iH);
                                    ctx.restore();

                                    dragDrawOperation = () => {
                                        const dX = this.dragInfo.currX - this.dragInfo.offsetX;
                                        const dY = this.dragInfo.currY - this.dragInfo.offsetY;
                                        ctx.save();
                                        ctx.shadowColor = 'rgba(0,0,0,0.8)';
                                        ctx.shadowBlur = 40 * scale;
                                        ctx.shadowOffsetY = 20 * scale;
                                        
                                        const fImg = this.getFilteredImage(item.originalData, iW, iH, bwAmount, invertAmount);
                                        ctx.drawImage(fImg, dX, dY, iW, iH);

                                        if (invertAmount > 0) {
                                            ctx.globalCompositeOperation = 'multiply';
                                            ctx.fillStyle = `rgba(220, 95, 15, ${invertAmount * 0.6})`;
                                            ctx.fillRect(dX, dY, iW, iH);
                                        }
                                        ctx.strokeStyle = 'rgba(255,255,255,0.8)';
                                        ctx.lineWidth = Math.max(2, baseH * 0.003 * scale);
                                        ctx.strokeRect(dX, dY, iW, iH);
                                        ctx.restore();
                                    };
                                } else {
                                    const fImg = this.getFilteredImage(item.originalData, iW, iH, bwAmount, invertAmount);
                                    ctx.drawImage(fImg, iX, iY, iW, iH);

                                    if (invertAmount > 0) {
                                        ctx.save();
                                        ctx.globalCompositeOperation = 'multiply';
                                        ctx.fillStyle = `rgba(220, 95, 15, ${invertAmount * 0.6})`;
                                        ctx.fillRect(iX, iY, iW, iH);
                                        ctx.restore();
                                    }
                                }

                                currX += iW + gap * scale;
                            });

                            if (matMultiplier > 0.4) {
                                const fontSize = baseH * 0.018 * scale;
                                ctx.textBaseline = 'middle';
                                const textTopY = fY + (filmPadY * 0.65 * scale);
                                const textBotY = fY + fH - (filmPadY * 0.65 * scale);

                                currX = fX + filmPadX * scale;
                                let frameIndex = rowIndex * (maxPerRow * 2) + 1; 
                                
                                rowInfo.layout.forEach((item, idx) => {
                                    const iW_scaled = item.w * scale;
                                    const filmStr = (item.originalData.filmName || 'KODAK PORTRA 400').toUpperCase();
                                    const seed = rowIndex * 100 + idx; 

                                    const bcW = baseH * 0.05 * scale, bcH = baseH * 0.01 * scale;
                                    this.drawDXCode(ctx, currX, textTopY - bcH*0.5, bcW, bcH, seed);
                                    
                                    ctx.fillStyle = '#facc15'; 
                                    ctx.font = `600 ${fontSize}px "Inter", sans-serif`; 
                                    
                                    ctx.textAlign = 'left'; 
                                    ctx.fillText(`${frameIndex}A`, currX + bcW*1.5, textTopY);
                                    ctx.textAlign = 'center'; 
                                    ctx.fillText(filmStr, currX + iW_scaled/2, textTopY);
                                    ctx.textAlign = 'right'; 
                                    ctx.fillText(`${frameIndex + 1}`, currX + iW_scaled, textTopY);
                                    
                                    ctx.textAlign = 'center';
                                    ctx.font = `400 ${fontSize * 0.8}px "JetBrains Mono", monospace`;
                                    ctx.fillStyle = 'rgba(250, 204, 21, 0.6)';
                                    ctx.fillText(item.originalData.exifParams || '', currX + iW_scaled/2, textBotY);

                                    currX += iW_scaled + gap * scale;
                                    frameIndex += 2;
                                });
                            }

                            ctx.save();
                            ctx.globalCompositeOperation = 'overlay';
                            ctx.fillStyle = grainPat;
                            ctx.globalAlpha = grainAlpha; 
                            ctx.fillRect(fX, fY, fW, fH);
                            ctx.restore();

                            currentY += fH + stripGap * scale;
                        });

                        if (dragDrawOperation) dragDrawOperation();
                    };

                } else if (style === 'exif_palette') {
                    wallPaddingX = 0; wallPaddingY = 0;
                    const padX = shortEdge * 0.1 * matMultiplier;
                    const padTop = shortEdge * 0.22 * matMultiplier;
                    const padBot = shortEdge * 0.3 * matMultiplier;
                    sceneW = imgW + padX * 2; sceneH = padTop + imgH + padBot;

                    drawLogic = (scale) => {
                        ctx.fillStyle = '#ffffff'; 
                        ctx.fillRect(0, 0, sceneW * scale, sceneH * scale);
                        
                        const iX = padX * scale, iY = padTop * scale, iW = imgW * scale, iH = imgH * scale;
                        
                        const fImg = this.getFilteredImage(imgData, iW, iH, bwAmount, invertAmount);
                        ctx.drawImage(fImg, iX, iY, iW, iH);

                        if (matMultiplier > 0.4) {
                            const sEdge = shortEdge * scale;
                            const bFont = sEdge * 0.022;
                            const brand = (exifCamera || 'CAMERA').split(' ')[0].toUpperCase();
                            const model = (exifCamera || 'UNKNOWN MODEL').replace(brand, '').trim() || exifCamera;

                            ctx.textAlign = 'left'; ctx.textBaseline = 'top';
                            ctx.fillStyle = '#111';
                            ctx.font = `600 ${bFont * 1.8}px "Inter", sans-serif`;
                            let letterSpc = bFont * 0.25;
                            try { ctx.letterSpacing = `${letterSpc}px`; } catch(e){}
                            ctx.fillText(brand, iX, iY - (padTop * scale * 0.65));
                            try { ctx.letterSpacing = '0px'; } catch(e){}

                            ctx.fillStyle = '#888';
                            ctx.font = `500 ${bFont * 0.6}px "Inter", sans-serif`;
                            ctx.fillText(model, iX, iY - (padTop * scale * 0.65) + bFont * 2.4);

                            const bY = iY + iH + (padBot * scale * 0.28);
                            ctx.fillStyle = '#111';
                            ctx.font = `600 ${bFont * 0.9}px "Inter", sans-serif`;
                            try { ctx.letterSpacing = `${bFont*0.1}px`; } catch(e){}
                            ctx.fillText(textLeft || 'UNTITLED ARTWORK', iX, bY);
                            try { ctx.letterSpacing = '0px'; } catch(e){}

                            ctx.fillStyle = '#666';
                            ctx.font = `500 ${bFont * 0.5}px "Inter", sans-serif`;
                            ctx.fillText(imgData.exifDate, iX, bY + bFont * 1.8);
                            ctx.fillText((exifParams || '16MM F2.8 1/100S ISO250') + '    ' + (exifLens || 'STANDARD LENS'), iX, bY + bFont * 2.8);

                            if (imgData.palette && imgData.palette.length > 0) {
                                const pW = sEdge * 0.08;
                                const pH = sEdge * 0.025;
                                let startX = iX + iW - (pW * imgData.palette.length);
                                imgData.palette.forEach((color, idx) => {
                                    ctx.fillStyle = color.rgbStr ? color.rgbStr : color; 
                                    ctx.fillRect(startX + (idx * pW), bY + bFont * 0.2, pW, pH);
                                });
                            }
                        }
                    };

                } else if (style === 'exif_minimal') {
                    wallPaddingX = 0; wallPaddingY = 0;
                    const padX = shortEdge * 0.1 * matMultiplier;
                    const padY = shortEdge * 0.15 * matMultiplier;
                    sceneW = imgW + padX * 2; sceneH = imgH + padY * 2;

                    drawLogic = (scale) => {
                        ctx.fillStyle = '#ffffff'; 
                        ctx.fillRect(0, 0, sceneW * scale, sceneH * scale);
                        
                        const iX = padX * scale, iY = padY * scale, iW = imgW * scale, iH = imgH * scale;
                        
                        const fImg = this.getFilteredImage(imgData, iW, iH, bwAmount, invertAmount);
                        ctx.drawImage(fImg, iX, iY, iW, iH);

                        if (matMultiplier > 0.4) {
                            const sEdge = shortEdge * scale;
                            const bFont = sEdge * 0.022;
                            const brand = (exifCamera || 'CAMERA').split(' ')[0].toUpperCase();
                            const model = (exifCamera || 'UNKNOWN MODEL').replace(brand, '').trim() || exifCamera;

                            ctx.textAlign = 'left'; ctx.textBaseline = 'top';
                            ctx.fillStyle = '#111111'; 
                            ctx.font = `600 ${bFont * 2}px "Inter", sans-serif`;
                            try { ctx.letterSpacing = `${bFont*0.08}px`; } catch(e){}
                            ctx.fillText(brand, iX, iY - (padY * scale * 0.6));
                            try { ctx.letterSpacing = '0px'; } catch(e){}

                            ctx.fillStyle = '#666666';
                            ctx.font = `400 ${bFont * 0.7}px "Inter", sans-serif`;
                            ctx.fillText(model, iX, iY - (padY * scale * 0.6) + bFont * 2.4);

                            const bY = iY + iH + (padY * scale * 0.25);
                            ctx.textAlign = 'right';
                            ctx.fillStyle = '#666666';
                            ctx.font = `400 ${bFont * 0.6}px "Inter", sans-serif`;
                            
                            ctx.fillText(exifLens || 'E 50-400MM F4.5-6.3', iX + iW, bY);
                            ctx.fillText(imgData.exifDate, iX + iW, bY + bFont * 1.3);
                            
                            ctx.fillStyle = '#333333'; 
                            ctx.font = `500 ${bFont * 0.65}px "Inter", sans-serif`;
                            try { ctx.letterSpacing = `${bFont*0.05}px`; } catch(e){}
                            ctx.fillText((exifParams || '16MM F2.8 1/100S ISO250').toUpperCase(), iX + iW, bY + bFont * 2.6);
                            try { ctx.letterSpacing = '0px'; } catch(e){}
                        }
                    };
                }

                let finalScale = 1;
                let outW, outH;

                if (targetWidth && targetHeight) {
                    finalScale = Math.min(targetWidth / sceneW, targetHeight / sceneH);
                    outW = sceneW * finalScale; outH = sceneH * finalScale;
                } else {
                    finalScale = this.OUTPUT_MAX_DIMENSION / Math.max(sceneW, sceneH);
                    outW = sceneW * finalScale; outH = sceneH * finalScale;
                }

                ctx.canvas.width = outW;
                ctx.canvas.height = outH;
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                
                return drawLogic(finalScale);
            }

            renderPreview(animate = true) {
                const imgData = this.getActiveImage();
                if (!imgData && this.state.settings.style !== 'film_strip') return;
                if (this.state.settings.style === 'film_strip' && this.state.images.length === 0) return;

                if (animate) {
                    this.dom.previewCanvas.classList.remove('loaded');
                }
                
                const dpr = window.devicePixelRatio || 1;
                const containerW = this.dom.canvasContainer.clientWidth;
                const containerH = this.dom.canvasContainer.clientHeight;
                const safeDpr = Math.min(dpr, 2);
                
                const dataToRender = imgData || this.state.images[0];
                const result = this.renderScene(this.ctx, dataToRender, containerW * safeDpr, containerH * safeDpr);
                
                const finalizeRender = () => {
                    this.dom.previewCanvas.style.width = 'auto';
                    this.dom.previewCanvas.style.height = 'auto';
                    this.dom.previewCanvas.style.maxWidth = '100%';
                    this.dom.previewCanvas.style.maxHeight = '100%';
                    
                    if (animate) {
                        requestAnimationFrame(() => {
                            requestAnimationFrame(() => {
                                this.dom.previewCanvas.classList.add('loaded');
                            });
                        });
                    } else {
                        this.dom.previewCanvas.classList.add('loaded');
                    }
                };

                if (result instanceof Promise) {
                    result.then(finalizeRender);
                } else {
                    finalizeRender();
                }
            }

            renderHighResBlob(imgData, styleOverride = null) {
                return new Promise(async (resolve) => { 
                    const originalStyle = this.state.settings.style;
                    if (styleOverride) this.state.settings.style = styleOverride;

                    const offscreenCanvas = document.createElement('canvas');
                    const offCtx = offscreenCanvas.getContext('2d', { alpha: false });
                    
                    await this.renderScene(offCtx, imgData, null, null);
                    
                    offscreenCanvas.toBlob((blob) => {
                        if (styleOverride) this.state.settings.style = originalStyle;
                        resolve(blob);
                    }, 'image/jpeg', 0.95);
                });
            }

            async downloadCurrent() {
                const imgData = this.getActiveImage();
                const dataToRender = imgData || this.state.images[0];
                if (!dataToRender || this.state.isProcessing) return;

                this.state.isProcessing = true;
                const originalText = this.dom.btnDownloadCurrent.innerHTML;
                this.dom.btnDownloadCurrent.innerHTML = '<i data-lucide="loader-2" class="w-3.5 h-3.5 animate-spin"></i> <span class="hidden sm:inline">渲染中</span>';
                lucide.createIcons({ root: this.dom.btnDownloadCurrent });
                
                try {
                    await new Promise(r => setTimeout(r, 50)); 
                    const blob = await this.renderHighResBlob(dataToRender);
                    const url = URL.createObjectURL(blob);
                    
                    const link = document.createElement('a');
                    const styleName = this.state.settings.style.toUpperCase();
                    link.download = `XiangEdition_${styleName}_${Date.now()}.jpg`;
                    link.href = url;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    
                    setTimeout(() => URL.revokeObjectURL(url), 1000);
                    this.showToast('高清展示图已保存', 'success');
                } catch (e) {
                    console.error(e);
                    this.showToast('导出失败', 'error');
                } finally {
                    this.state.isProcessing = false;
                    this.dom.btnDownloadCurrent.innerHTML = originalText;
                    lucide.createIcons({ root: this.dom.btnDownloadCurrent });
                }
            }

            async downloadAll() {
                if (this.state.images.length === 0 || this.state.isProcessing) return;

                this.state.isProcessing = true;
                this.dom.progressModal.classList.remove('opacity-0', 'pointer-events-none');
                
                const stylesToGen = ['museum', 'framed', 'exif_palette', 'exif_minimal', 'immersive_color']; 
                const totalTasks = this.state.images.length * stylesToGen.length; 
                let currentTask = 0;
                
                this.dom.progressTitle.textContent = '正在生成全套画册...';
                this.updateProgress(0, totalTasks);

                try {
                    const zip = new JSZip();
                    
                    for (let i = 0; i < this.state.images.length; i++) {
                        const img = this.state.images[i];
                        const baseName = img.file.name.substring(0, img.file.name.lastIndexOf('.')) || `Image_${i+1}`;
                        const folder = zip.folder(baseName);
                        
                        for (let style of stylesToGen) {
                            const blob = await this.renderHighResBlob(img, style);
                            folder.file(`${baseName}_${style.toUpperCase()}.jpg`, blob);
                            
                            currentTask++;
                            this.updateProgress(currentTask, totalTasks);
                            await new Promise(r => requestAnimationFrame(r));
                        }
                    }

                    this.dom.progressTitle.textContent = '正在压缩打包 ZIP...';
                    this.dom.progressBar.classList.add('animate-pulse');

                    const zipContent = await zip.generateAsync({ type: "blob" });
                    
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(zipContent);
                    link.download = `XiangEdition_Pro_Gallery_${Date.now()}.zip`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    
                    this.showToast('批量全套展示图已导出！', 'success');
                } catch (e) {
                    console.error(e);
                    this.showToast('打包失败，请检查内存或稍后重试', 'error');
                } finally {
                    this.dom.progressBar.classList.remove('animate-pulse');
                    this.dom.progressModal.classList.add('opacity-0', 'pointer-events-none');
                    this.state.isProcessing = false;
                }
            }
            
            updateProgress(current, total) {
                const percent = Math.floor((current / total) * 100);
                this.dom.progressBar.style.width = `${percent}%`;
                this.dom.progressCount.textContent = `${current} / ${total} TICKET`;
            }

            showToast(message, type = 'info') {
                const toast = document.createElement('div');
                const bgColor = type === 'error' ? 'bg-red-600' : 'bg-[#1a1a1a]';
                toast.className = `toast flex items-center gap-3 px-5 py-3 ${bgColor} text-white shadow-2xl rounded max-w-sm pointer-events-auto`;
                
                let icon = 'info';
                if (type === 'success') icon = 'check-circle-2';
                if (type === 'error') icon = 'alert-triangle';
                
                toast.innerHTML = `
                    <i data-lucide="${icon}" class="w-4 h-4 shrink-0 text-white/90"></i>
                    <span class="text-xs font-medium tracking-wide">${message}</span>
                `;
                
                this.dom.toastContainer.appendChild(toast);
                lucide.createIcons({ root: toast });
                
                setTimeout(() => {
                    toast.style.transform = 'translateY(120%)';
                    toast.style.opacity = '0';
                    toast.style.transition = 'all 0.5s cubic-bezier(0.16, 1, 0.3, 1)';
                    setTimeout(() => toast.remove(), 500);
                }, 3000);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            new AppController();
        });
    </script>
</body>
