                            });

                            if (matMultiplier > 0.4) {
                                const fontSize = baseH * 0.018 * scale; ctx.textBaseline = 'middle';
                                const textTopY = fY + (filmPadY * 0.65 * scale); const textBotY = fY + fH - (filmPadY * 0.65 * scale);
                                currX = fX + filmPadX * scale; let frameIndex = rowIndex * (maxPerRow * 2) + 1; 
                                
                                rowInfo.layout.forEach((item, idx) => {
                                    const iW_scaled = item.w * scale; const filmStr = (item.originalData.filmName || 'KODAK PORTRA 400').toUpperCase(); const seed = rowIndex * 100 + idx; 
                                    const bcW = baseH * 0.05 * scale, bcH = baseH * 0.01 * scale;
                                    this.drawDXCode(ctx, currX, textTopY - bcH*0.5, bcW, bcH, seed);
                                    ctx.fillStyle = '#facc15'; ctx.font = `600 ${fontSize}px "Inter", sans-serif`; 
                                    ctx.textAlign = 'left'; ctx.fillText(`${frameIndex}A`, currX + bcW*1.5, textTopY);
                                    ctx.textAlign = 'center'; ctx.fillText(filmStr, currX + iW_scaled/2, textTopY);
                                    ctx.textAlign = 'right'; ctx.fillText(`${frameIndex + 1}`, currX + iW_scaled, textTopY);
                                    ctx.textAlign = 'center'; ctx.font = `400 ${fontSize * 0.8}px "JetBrains Mono", monospace`; ctx.fillStyle = 'rgba(250, 204, 21, 0.6)';
                                    ctx.fillText(item.originalData.exifParams || '', currX + iW_scaled/2, textBotY);
                                    currX += iW_scaled + gap * scale; frameIndex += 2;
                                });
                            }
                            ctx.save(); ctx.globalCompositeOperation = 'overlay'; ctx.fillStyle = grainPat; ctx.globalAlpha = grainAlpha; ctx.fillRect(fX, fY, fW, fH); ctx.restore();
                            currentY += fH + stripGap * scale;
                        });
                        if (dragDrawOperation) dragDrawOperation();
                    };

                } else if (style === 'exif_palette') {
                    wallPaddingX = 0; wallPaddingY = 0;
                    const padX = shortEdge * 0.1 * matMultiplier; const padTop = shortEdge * 0.22 * matMultiplier; const padBot = shortEdge * 0.3 * matMultiplier;
                    sceneW = imgW + padX * 2; sceneH = padTop + imgH + padBot;

                    drawLogic = (scale) => {
                        ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, sceneW * scale, sceneH * scale);
                        const iX = padX * scale, iY = padTop * scale, iW = imgW * scale, iH = imgH * scale;
                        const fImg = this.getFilteredImage(imgData, iW, iH, bwAmount, invertAmount);
                        ctx.drawImage(fImg, iX, iY, iW, iH);

                        if (matMultiplier > 0.4) {
                            const sEdge = shortEdge * scale; const bFont = sEdge * 0.022;
                            const brand = (exifCamera || 'CAMERA').split(' ')[0].toUpperCase();
                            const model = (exifCamera || 'UNKNOWN MODEL').replace(brand, '').trim() || exifCamera;

                            ctx.textAlign = 'left'; ctx.textBaseline = 'top';
                            ctx.fillStyle = '#1e293b'; ctx.font = `800 ${bFont * 1.8}px "Inter", sans-serif`;
                            let letterSpc = bFont * 0.25;
                            try { ctx.letterSpacing = `${letterSpc}px`; } catch(e){} ctx.fillText(brand, iX, iY - (padTop * scale * 0.65)); try { ctx.letterSpacing = '0px'; } catch(e){}

                            ctx.fillStyle = '#64748b'; ctx.font = `600 ${bFont * 0.6}px "Inter", sans-serif`;
                            ctx.fillText(model, iX, iY - (padTop * scale * 0.65) + bFont * 2.4);

                            const bY = iY + iH + (padBot * scale * 0.28);
                            ctx.fillStyle = '#1e293b'; ctx.font = `700 ${bFont * 0.9}px "Inter", sans-serif`;
                            try { ctx.letterSpacing = `${bFont*0.1}px`; } catch(e){} ctx.fillText(textLeft || 'UNTITLED ARTWORK', iX, bY); try { ctx.letterSpacing = '0px'; } catch(e){}

                            ctx.fillStyle = '#64748b'; ctx.font = `500 ${bFont * 0.5}px "Inter", sans-serif`;
                            ctx.fillText(imgData.exifDate, iX, bY + bFont * 1.8);
                            ctx.fillText((exifParams || '16MM F2.8 1/100S ISO250') + '    ' + (exifLens || 'STANDARD LENS'), iX, bY + bFont * 2.8);

                            if (imgData.palette && imgData.palette.length > 0) {
                                const pW = sEdge * 0.08; const pH = sEdge * 0.025;
                                let startX = iX + iW - (pW * imgData.palette.length);
                                imgData.palette.forEach((color, idx) => {
                                    ctx.fillStyle = color.rgbStr ? color.rgbStr : color; 
                                    ctx.fillRect(startX + (idx * pW), bY + bFont * 0.2, pW, pH);
                                });
                            }
                        }
                    };

                } else if (style === 'exif_minimal') {
                    wallPaddingX = 0; wallPaddingY = 0;
                    const padX = shortEdge * 0.1 * matMultiplier; const padY = shortEdge * 0.15 * matMultiplier;
                    sceneW = imgW + padX * 2; sceneH = imgH + padY * 2;

                    drawLogic = (scale) => {
                        ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, sceneW * scale, sceneH * scale);
                        const iX = padX * scale, iY = padY * scale, iW = imgW * scale, iH = imgH * scale;
                        const fImg = this.getFilteredImage(imgData, iW, iH, bwAmount, invertAmount);
                        ctx.drawImage(fImg, iX, iY, iW, iH);

                        if (matMultiplier > 0.4) {
                            const sEdge = shortEdge * scale; const bFont = sEdge * 0.022;
                            const brand = (exifCamera || 'CAMERA').split(' ')[0].toUpperCase();
                            const model = (exifCamera || 'UNKNOWN MODEL').replace(brand, '').trim() || exifCamera;

                            ctx.textAlign = 'left'; ctx.textBaseline = 'top';
                            ctx.fillStyle = '#0f172a'; ctx.font = `700 ${bFont * 2}px "Inter", sans-serif`;
                            try { ctx.letterSpacing = `${bFont*0.08}px`; } catch(e){} ctx.fillText(brand, iX, iY - (padY * scale * 0.6)); try { ctx.letterSpacing = '0px'; } catch(e){}

                            ctx.fillStyle = '#475569'; ctx.font = `500 ${bFont * 0.7}px "Inter", sans-serif`;
                            ctx.fillText(model, iX, iY - (padY * scale * 0.6) + bFont * 2.4);

                            const bY = iY + iH + (padY * scale * 0.25);
                            ctx.textAlign = 'right'; ctx.fillStyle = '#64748b'; ctx.font = `500 ${bFont * 0.6}px "Inter", sans-serif`;
                            ctx.fillText(exifLens || 'E 50-400MM F4.5-6.3', iX + iW, bY);
                            ctx.fillText(imgData.exifDate, iX + iW, bY + bFont * 1.3);
                            
                            ctx.fillStyle = '#1e293b'; ctx.font = `600 ${bFont * 0.65}px "Inter", sans-serif`;
                            try { ctx.letterSpacing = `${bFont*0.05}px`; } catch(e){} ctx.fillText((exifParams || '16MM F2.8 1/100S ISO250').toUpperCase(), iX + iW, bY + bFont * 2.6); try { ctx.letterSpacing = '0px'; } catch(e){}
                        }
                    };
                }

                let finalScale = 1; let outW, outH;
                if (targetWidth && targetHeight) {
                    finalScale = Math.min(targetWidth / sceneW, targetHeight / sceneH);
                    outW = sceneW * finalScale; outH = sceneH * finalScale;
                } else {
                    finalScale = this.OUTPUT_MAX_DIMENSION / Math.max(sceneW, sceneH);
                    outW = sceneW * finalScale; outH = sceneH * finalScale;
                }

                ctx.canvas.width = outW; ctx.canvas.height = outH;
                ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
                
                return drawLogic(finalScale);
            }

            renderPreview(animate = true) {
                const imgData = this.getActiveImage();
                if (!imgData && this.state.settings.style !== 'film_strip') return;
                if (this.state.settings.style === 'film_strip' && this.state.images.length === 0) return;

                if (animate) { this.dom.previewCanvas.classList.remove('loaded'); }
                
                const dpr = window.devicePixelRatio || 1;
                const containerW = this.dom.workspace.clientWidth;
                const containerH = this.dom.workspace.clientHeight;
                const safeDpr = Math.min(dpr, 2);
                
                const dataToRender = imgData || this.state.images[0];
                const result = this.renderScene(this.ctx, dataToRender, containerW * safeDpr, containerH * safeDpr);
                
                const finalizeRender = () => {
                    this.dom.previewCanvas.style.width = 'auto'; this.dom.previewCanvas.style.height = 'auto';
                    this.dom.previewCanvas.style.maxWidth = '100%'; this.dom.previewCanvas.style.maxHeight = '100%';
                    if (animate) {
                        requestAnimationFrame(() => requestAnimationFrame(() => this.dom.previewCanvas.classList.add('loaded')));
                    } else {
                        this.dom.previewCanvas.classList.add('loaded');
                    }
                };

                if (result instanceof Promise) result.then(finalizeRender); else finalizeRender();
            }

            renderHighResBlob(imgData, styleOverride = null) {
                return new Promise(async (resolve) => { 
                    const originalStyle = this.state.settings.style;
                    if (styleOverride) this.state.settings.style = styleOverride;

                    const offscreenCanvas = document.createElement('canvas');
                    const offCtx = offscreenCanvas.getContext('2d', { alpha: false });
                    
                    await this.renderScene(offCtx, imgData, null, null);
                    
                    offscreenCanvas.toBlob((blob) => {
                        if (styleOverride) this.state.settings.style = originalStyle;
                        resolve(blob);
                    }, 'image/jpeg', 0.95);
                });
            }

            async downloadCurrent() {
                const imgData = this.getActiveImage();
                const dataToRender = imgData || this.state.images[0];
                if (!dataToRender || this.state.isProcessing) return;

                this.state.isProcessing = true;
                const originalText = this.dom.btnDownloadCurrent.innerHTML;
                this.dom.btnDownloadCurrent.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> <span class="hidden sm:inline">渲染中</span>';
                
                try {
                    await new Promise(r => setTimeout(r, 50)); 
                    const blob = await this.renderHighResBlob(dataToRender);
                    const url = URL.createObjectURL(blob);
                    
                    const link = document.createElement('a');
                    const styleName = this.state.settings.style.toUpperCase();
                    link.download = `Frame2.0_${styleName}_${Date.now()}.jpg`;
                    link.href = url;
                    document.body.appendChild(link); link.click(); document.body.removeChild(link);
                    
                    setTimeout(() => URL.revokeObjectURL(url), 1000);
                    triggerHaptic('success');
                    this.showToast('高清展示图已保存', 'success');
                } catch (e) {
                    console.error(e); this.showToast('导出失败', 'error');
                } finally {
                    this.state.isProcessing = false; this.dom.btnDownloadCurrent.innerHTML = originalText;
                }
            }

            async downloadAll() {
                if (this.state.images.length === 0 || this.state.isProcessing) return;

                this.state.isProcessing = true;
                this.dom.progressModal.classList.remove('opacity-0', 'pointer-events-none');
                
                const stylesToGen = ['museum', 'framed', 'exif_palette', 'exif_minimal', 'immersive_color']; 
                const totalTasks = this.state.images.length * stylesToGen.length; 
                let currentTask = 0;
                
                this.dom.progressTitle.textContent = '正在生成全套画册...';
                this.updateProgress(0, totalTasks);

                try {
                    const zip = new JSZip();
                    
                    for (let i = 0; i < this.state.images.length; i++) {
                        const img = this.state.images[i];
                        const baseName = img.file.name.substring(0, img.file.name.lastIndexOf('.')) || `Image_${i+1}`;
                        const folder = zip.folder(baseName);
                        
                        for (let style of stylesToGen) {
                            const blob = await this.renderHighResBlob(img, style);
                            folder.file(`${baseName}_${style.toUpperCase()}.jpg`, blob);
                            
                            currentTask++;
                            this.updateProgress(currentTask, totalTasks);
                            await new Promise(r => requestAnimationFrame(r));
                        }
                    }

                    this.dom.progressTitle.textContent = '正在压缩打包 ZIP...';
                    this.dom.progressBar.classList.add('animate-pulse');

                    const zipContent = await zip.generateAsync({ type: "blob" });
                    
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(zipContent);
                    link.download = `Frame2.0_Gallery_${Date.now()}.zip`;
                    document.body.appendChild(link); link.click(); document.body.removeChild(link);
                    
                    triggerHaptic('success');
                    this.showToast('批量全套展示图已导出！', 'success');
                } catch (e) {
                    console.error(e); this.showToast('打包失败，请检查内存或稍后重试', 'error');
                } finally {
                    this.dom.progressBar.classList.remove('animate-pulse');
                    this.dom.progressModal.classList.add('opacity-0', 'pointer-events-none');
                    this.state.isProcessing = false;
                }
            }
            
            updateProgress(current, total) {
                const percent = Math.floor((current / total) * 100);
                this.dom.progressBar.style.width = `${percent}%`;
                this.dom.progressCount.textContent = `${current} / ${total} TICKET`;
            }

            showToast(message, type = 'info') {
                const toast = document.createElement('div');
                const bgColor = type === 'error' ? 'bg-red-600' : 'bg-slate-900';
                toast.className = `toast flex items-center gap-3 px-4 py-2.5 ${bgColor} text-white shadow-2xl rounded-md max-w-sm pointer-events-auto`;
                
                let icon = 'fa-circle-info';
                if (type === 'success') icon = 'fa-circle-check';
                if (type === 'error') icon = 'fa-triangle-exclamation';
                
                toast.innerHTML = `<i class="fa-solid ${icon} text-white/90"></i><span class="text-xs font-bold tracking-wide">${message}</span>`;
                this.dom.toastContainer.appendChild(toast);
                
                requestAnimationFrame(() => requestAnimationFrame(() => toast.classList.add('show')));
                setTimeout(() => {
                    toast.classList.remove('show');
                    setTimeout(() => toast.remove(), 400);
                }, 3000);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            new AppController();
        });
    </script>
</body>
